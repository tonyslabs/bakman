[program:web]
command=php artisan serve --host=0.0.0.0 --port=8080 --no-reload
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
directory=/var/www/html
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
command=php artisan queue:work --sleep=3 --tries=1 --timeout=3600
directory=/var/www/html
autorestart=true
; queue:work termina el job en curso al recibir SIGTERM; darle tiempo en vez de matarlo a los 10 s
; (un redeploy cortaba el sync de Betel a la mitad). Debe ser menor que stop_grace_period del compose.
stopwaitsecs=600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
